
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Placeholder</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .phone-frame {
      background: white;
      border-radius: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      width: 390px;
      height: 844px;
      overflow: hidden;
    }
    .status-bar {
      background: #0d9488;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
    }
    .content {
      padding: 20px;
    }
    h1 {
      color: #1f2937;
      font-size: 28px;
      margin-bottom: 10px;
    }
    p {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>Analisi Tracker</span>
      <span>🔋</span>
    </div>
    <div class="content">
      <h1>Your Lab Results</h1>
      <p>Track your health with advanced analytics and insights</p>
    </div>
  </div>
</body>
</html>
